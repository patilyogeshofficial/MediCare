
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- MediCare Branding -->
    <title>MediCare | Healthcare Administration Console</title>

    <meta
      name="description"
      content="MediCare is a modern healthcare administration console that helps patients, doctors, and administrators manage appointments, prescriptions, and healthcare activities."
    />

    <meta name="author" content="MediCare" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MediCare" />
    <meta
      property="og:title"
      content="MediCare | Healthcare Administration Console"
    />
    <meta
      property="og:description"
      content="A modern healthcare administration console for patients, doctors, and administrators."
    />

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="MediCare | Healthcare Administration Console"
    />
    <meta
      name="twitter:description"
      content="A modern healthcare administration console for patients, doctors, and administrators."
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
